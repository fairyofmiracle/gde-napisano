# Публичный вход — только через Caddy (порты 80/443). Приложение, Qdrant, Ollama и Redis наружу не открыты.
# На сервере в .env: PUBLIC_BIND=0.0.0.0 (без этого Caddy слушает только 127.0.0.1).
# Запуск:            docker compose up -d --build
# С доменом и HTTPS: SITE_ADDRESS=ваш.домен (или 203-0-113-5.sslip.io) в .env — Caddy сам получит сертификат
# С локальной LLM:   docker compose --profile ollama up -d --build
# С Redis:           добавить --profile redis и REDIS_URL=redis://redis:6379/0 в .env
# С Telegram-ботом:  TELEGRAM_BOT_TOKEN в .env, затем --profile bot (без токена бот сразу завершается)
# Для отладки с сервера: APP_PORT открыт только на 127.0.0.1 (ssh -L 8010:127.0.0.1:8010 user@server)
name: gde-napisano

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_started
    # PUBLIC_BIND=0.0.0.0 — открыть наружу (на сервере). По умолчанию только этот компьютер.
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${PUBLIC_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    environment:
      # Пусто = обычный http на :80. Домен = автоматический HTTPS (Let's Encrypt).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      MAX_BODY: ${PROXY_MAX_BODY:-60MB}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  app:
    build:
      context: .
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-0}
        PREFETCH_MODELS: ${PREFETCH_MODELS:-0}
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
      DATA_DIR: /data
      DOCS_DIR: /data/docs
      HF_HOME: /models
      # X-Forwarded-For принимается только от Caddy: так лимиты считаются по настоящему адресу клиента
      FORWARDED_ALLOW_IPS: 172.28.0.10
      # У бота свои лимиты на каждого пользователя Telegram
      TRUSTED_CLIENT_IPS: 172.28.0.11
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    volumes:
      - app-data:/data
      - hf-models:/models
      # Корневой сертификат НУЦ Минцифры для GigaChat (scripts/get_russian_ca.sh). Подхватывается сам.
      - ./certs:/certs:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 300s
    networks:
      backend: {}
    restart: unless-stopped
    mem_limit: 3500m
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6343}:6333"
    healthcheck:
      # в образе нет curl: проверяем, что порт принимает соединения
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      backend: {}
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.18
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11444}:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    networks:
      backend: {}
    restart: unless-stopped
    mem_limit: 2800m
    logging: *logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    profiles: ["bot"]
    env_file:
      - path: .env
        required: false
    environment:
      DOCAGENT_URL: http://app:8000
      HF_HOME: /models
      GIGAAM_DIR: /models/gigaam
    volumes:
      - bot-models:/models
    depends_on:
      app:
        condition: service_started
    networks:
      backend:
        ipv4_address: 172.28.0.11
    restart: unless-stopped
    # GigaAM занимает около 1,5 ГБ, пока идёт распознавание; через TRANSCRIBER_IDLE_SECONDS простоя память освобождается
    mem_limit: 2200m
    logging: *logging

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    networks:
      backend: {}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

networks:
  backend:
    ipam:
      config:
        # Постоянные адреса (.10 Caddy, .11 бот) вне диапазона, который Docker раздаёт сам (.128–.255)
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25

volumes:
  app-data:
  hf-models:
  qdrant-data:
  ollama-models:
  bot-models:
  caddy-data:
  caddy-config:
